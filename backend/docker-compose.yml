services:
  # -------------------------------------------------------------
  # MySQL Database Service
  # -------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: chatbot_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DB:-chatbot_db}
      MYSQL_USER: ${MYSQL_USER:-chatbot_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-chatbot_password}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chatbot_net

  # -------------------------------------------------------------
  # Redis Cache & Rate-Limiter Service
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: chatbot_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chatbot_net

  # -------------------------------------------------------------
  # FastAPI Application Backend Service
  # -------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chatbot_fastapi
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DEBUG=${DEBUG:-False}
      - APP_NAME=AI Chatbot Backend
      - API_V1_PREFIX=/api/v1
      - DATABASE_URL=mysql+asyncmy://${MYSQL_USER:-chatbot_user}:${MYSQL_PASSWORD:-chatbot_password}@mysql:3306/${MYSQL_DB:-chatbot_db}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-replace_with_a_secure_production_secret_key_at_least_32_chars}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - ALLOWED_ORIGINS=["http://localhost:3000","http://localhost:5173"]
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - LLM_MODEL=${LLM_MODEL:-gemini-3.1-flash-lite}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - MAX_CONTEXT_MESSAGES=10
    env_file:
      - .env
    networks:
      - chatbot_net

volumes:
  mysql_data:
  redis_data:

networks:
  chatbot_net:
    driver: bridge
